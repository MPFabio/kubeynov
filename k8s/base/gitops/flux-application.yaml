apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: GitRepository
metadata:
  name: kubeynov
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/MPFabio/kubeynov
  ref:
    branch: main
  secretRef:
    name: kubeynov-credentials
---
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: kubeynov-app
  namespace: flux-system
spec:
  interval: 5m
  path: ./k8s/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubeynov
  validation: client
  targetNamespace: default

